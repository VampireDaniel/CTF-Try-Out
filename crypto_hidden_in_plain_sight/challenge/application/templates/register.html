<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidden In Plain Sight</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='main.css') }}" rel="stylesheet">
</head>
<body class="m-bg">
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-success">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" href="{{ url_for('views.home') }}">Hidden in Plain Sight</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-success" href="{{ url_for('views.home') }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-success" href="{{ url_for('views.register') }}">Register</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-success" href="#">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 form-container m-card">
            <h1 class="text-success fw-bold text-center">Register</h1>
            <p class="text-center">Fill in your credentials and join us. Some things are not as they appear...</p>
            {% if error %}
            <div class="text-center error-message">{{ error }}</div>
            {% endif %}
            <form action="{{ url_for('views.register') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold text-success">Username</label>
                    <input type="text" name="username" id="username" class="form-control border-success text-success" placeholder="Enter your username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold text-success">Password</label>
                    <input type="password" name="password" id="password" class="form-control border-success text-success" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-success fw-bold w-100 text-dark">Register</button>
            </form>
        </div>
    </div>
</body>
</html>
